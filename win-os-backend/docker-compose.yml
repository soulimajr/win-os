services:
  win-os-backend:
    build: .
    container_name: win-os-backend
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    env_file:
      - .env
    networks:
      - network_public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=network_public"

      - "traefik.http.middlewares.win-os-backend-strip-api.stripprefix.prefixes=/api"

      - "traefik.http.routers.win-os-backend-api.rule=Host(`app.creativeagenciamkt.com.br`) && PathPrefix(`/api`)"
      - "traefik.http.routers.win-os-backend-api.entrypoints=websecure"
      - "traefik.http.routers.win-os-backend-api.tls=true"
      - "traefik.http.routers.win-os-backend-api.tls.certresolver=le"
      - "traefik.http.routers.win-os-backend-api.middlewares=win-os-backend-strip-api"

      - "traefik.http.routers.win-os-backend-api-http.rule=Host(`app.creativeagenciamkt.com.br`) && PathPrefix(`/api`)"
      - "traefik.http.routers.win-os-backend-api-http.entrypoints=web"
      - "traefik.http.routers.win-os-backend-api-http.middlewares=redirect-to-https@docker"

      - "traefik.http.services.win-os-backend-api.loadbalancer.server.port=8000"

networks:
  network_public:
    external: true
