    <path d="M330 145L390 360L449 145H520L419 453H348L303 294L330 145Z"
          fill="#7E1111" opacity="0.16"/>
    <path d="M82 145H157L220 360L273 183C278 165 289 145 306 145H331L390 360L449 145H520"
          fill="none" stroke="url(#edgeGrad)" stroke-width="10" stroke-linejoin="round" opacity="0.72"/>
  </g>

  <g filter="url(#softGlow)">
    <rect x="150" y="478" width="300" height="4" rx="2" fill="url(#winGrad)"/>
  </g>

  <text x="300" y="525" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="46" letter-spacing="4" fill="#FFFFFF">WIN-OS</text>
