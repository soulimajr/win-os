<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0c0e" />
      <stop offset="50%" stop-color="#121316" />
      <stop offset="100%" stop-color="#070809" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8d596" />
      <stop offset="35%" stop-color="#c9a24b" />
      <stop offset="70%" stop-color="#f3e5ab" />
      <stop offset="100%" stop-color="#8a6e33" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', Consolas, 'Roboto Mono', monospace; }
    .display { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; }
  </style>

  <!-- Background Base -->
  <rect width="1080" height="1350" fill="url(#bgGrad)" />

  <!-- Borders -->
  <rect x="40" y="40" width="1000" height="1270" rx="24" fill="none" stroke="#232427" stroke-width="1.5" />
  <rect x="52" y="52" width="976" height="1246" rx="20" fill="none" stroke="#c9a24b" stroke-width="1" opacity="0.25" />

  <!-- Header Pill -->
  <g transform="translate(540, 110)">
    <rect x="-130" y="-20" width="260" height="40" rx="20" fill="#17181b" stroke="#232427" stroke-width="1.5" />
    <text x="0" y="6" text-anchor="middle" fill="#c9a24b" class="mono" font-size="14" letter-spacing="3">/ 01. LIDERANCA.SYS</text>
  </g>

  <!-- Title -->
  <g transform="translate(540, 220)">
    <text x="0" y="0" text-anchor="middle" fill="#edebe6" class="display" font-size="44" letter-spacing="-0.5">A TORRE DE CONTROLE:</text>
    <text x="0" y="55" text-anchor="middle" fill="url(#goldGrad)" class="display" font-size="44" letter-spacing="-0.5">VOCÊ NO COMANDO.</text>
  </g>

  <!-- CEO Card -->
  <g transform="translate(540, 420)">
    <rect x="-260" y="-70" width="520" height="140" rx="20" fill="#17181b" stroke="url(#goldGrad)" stroke-width="2" filter="url(#glow)" />
    <!-- Crown icon -->
    <path d="M-20 -25 L-10 -5 L0 -25 L10 -5 L20 -25 L15 15 L-15 15 Z" fill="url(#goldGrad)" />
    <text x="0" y="-35" text-anchor="middle" fill="#c9a24b" class="mono" font-size="14" letter-spacing="2">NÍVEL 01 // AUTORIDADE MÁXIMA</text>
    <text x="0" y="45" text-anchor="middle" fill="#edebe6" class="display" font-size="28">CEO (VOCÊ)</text>
    <text x="0" y="75" text-anchor="middle" fill="#9a958a" class="body" font-size="16">Visão estratégica e poder de aprovação final</text>
  </g>

  <!-- Golden Connection Beam -->
  <line x1="540" y1="520" x2="540" y2="640" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="6,4" />

  <!-- NEXUS Card -->
  <g transform="translate(540, 750)">
    <rect x="-380" y="-90" width="760" height="180" rx="20" fill="#121316" stroke="#232427" stroke-width="1.5" />
    <rect x="-70" y="-110" width="140" height="36" rx="18" fill="#17181b" stroke="#c9a24b" stroke-width="1" />
    <text x="0" y="-87" text-anchor="middle" fill="#c9a24b" class="mono" font-size="12" letter-spacing="2">COORDENAÇÃO</text>
    <text x="0" y="-20" text-anchor="middle" fill="#edebe6" class="display" font-size="32">NEXUS — SQUAD COORDENADOR</text>
    <text x="0" y="20" text-anchor="middle" fill="#9a958a" class="body" font-size="18">O cérebro operacional que traduz a visão do CEO,</text>
    <text x="0" y="50" text-anchor="middle" fill="#9a958a" class="body" font-size="18">orquestra as prioridades da semana e distribui entre os 4 gerentes.</text>
  </g>

  <!-- Golden Rule Card -->
  <g transform="translate(540, 1020)">
    <rect x="-420" y="-45" width="840" height="90" rx="16" fill="#17181b" stroke="#c9a24b" stroke-width="1" />
    <text x="0" y="-5" text-anchor="middle" fill="#edebe6" class="display" font-size="20">A REGRA INVIOLÁVEL DA HIERARQUIA:</text>
    <text x="0" y="25" text-anchor="middle" fill="#c9a24b" class="body" font-size="18">Nenhuma ação real é executada sem o seu aval explícito.</text>
  </g>

  <!-- Footer -->
  <g transform="translate(540, 1220)">
    <line x1="-400" y1="0" x2="400" y2="0" stroke="#232427" stroke-width="1" />
    <text x="0" y="45" text-anchor="middle" fill="#9a958a" class="mono" font-size="14" letter-spacing="2">CONHEÇA OS 4 GERENTES ▸</text>
  </g>
</svg>
