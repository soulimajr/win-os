<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0c0e" />
      <stop offset="50%" stop-color="#121316" />
      <stop offset="100%" stop-color="#070809" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8d596" />
      <stop offset="35%" stop-color="#c9a24b" />
      <stop offset="70%" stop-color="#f3e5ab" />
      <stop offset="100%" stop-color="#8a6e33" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', Consolas, 'Roboto Mono', monospace; }
    .display { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; }
  </style>

  <rect width="1080" height="1350" fill="url(#bgGrad)" />
  <rect x="40" y="40" width="1000" height="1270" rx="24" fill="none" stroke="#232427" stroke-width="1.5" />
  <rect x="52" y="52" width="976" height="1246" rx="20" fill="none" stroke="#c9a24b" stroke-width="1" opacity="0.25" />

  <!-- Header Pill -->
  <g transform="translate(540, 110)">
    <rect x="-140" y="-20" width="280" height="40" rx="20" fill="#17181b" stroke="#232427" stroke-width="1.5" />
    <text x="0" y="6" text-anchor="middle" fill="#c9a24b" class="mono" font-size="14" letter-spacing="3">/ 02. MARKETING.SYS</text>
  </g>

  <!-- Title -->
  <g transform="translate(540, 220)">
    <text x="0" y="0" text-anchor="middle" fill="#edebe6" class="display" font-size="44" letter-spacing="-0.5">GERENTE DE MARKETING</text>
    <text x="0" y="55" text-anchor="middle" fill="url(#goldGrad)" class="display" font-size="44" letter-spacing="-0.5">&amp; TRÁFEGO PAGO</text>
    <text x="0" y="105" text-anchor="middle" fill="#9a958a" class="mono" font-size="16" letter-spacing="2">26 SKILLS OPERACIONAIS NO SEU COMANDO</text>
  </g>

  <!-- Deliverables Grid -->
  <g transform="translate(540, 420)">
    <!-- Box 1: Tráfego Pago -->
    <g transform="translate(0, 0)">
      <rect x="-420" y="0" width="840" height="130" rx="16" fill="#121316" stroke="#232427" stroke-width="1.5" />
      <circle cx="-360" cy="65" r="30" fill="#17181b" stroke="#c9a24b" stroke-width="1.5" />
      <text x="-360" y="73" text-anchor="middle" fill="#c9a24b" class="display" font-size="20">01</text>
      <text x="-300" y="50" fill="#edebe6" class="display" font-size="22">Tráfego Pago &amp; Anúncios</text>
      <text x="-300" y="85" fill="#9a958a" class="body" font-size="16">Estrutura de campanhas, copies persuasivas e otimização de ROAS.</text>
    </g>

    <!-- Box 2: Social Media & Conteúdo -->
    <g transform="translate(0, 160)">
      <rect x="-420" y="0" width="840" height="130" rx="16" fill="#121316" stroke="#232427" stroke-width="1.5" />
      <circle cx="-360" cy="65" r="30" fill="#17181b" stroke="#c9a24b" stroke-width="1.5" />
      <text x="-360" y="73" text-anchor="middle" fill="#c9a24b" class="display" font-size="20">02</text>
      <text x="-300" y="50" fill="#edebe6" class="display" font-size="22">Social Media &amp; Criação</text>
      <text x="-300" y="85" fill="#9a958a" class="body" font-size="16">Pautas estratégicas, roteiros de Reels, carrosséis de autoridade e legendas.</text>
    </g>

    <!-- Box 3: Presença Local & Web -->
    <g transform="translate(0, 320)">
      <rect x="-420" y="0" width="840" height="130" rx="16" fill="#121316" stroke="#232427" stroke-width="1.5" />
      <circle cx="-360" cy="65" r="30" fill="#17181b" stroke="#c9a24b" stroke-width="1.5" />
      <text x="-360" y="73" text-anchor="middle" fill="#c9a24b" class="display" font-size="20">03</text>
      <text x="-300" y="50" fill="#edebe6" class="display" font-size="22">Google Meu Negócio &amp; Sites</text>
      <text x="-300" y="85" fill="#9a958a" class="body" font-size="16">Otimização de perfil local para busca e arquitetura de sites institucionais.</text>
    </g>

    <!-- Box 4: Direção de Arte -->
    <g transform="translate(0, 480)">
      <rect x="-420" y="0" width="840" height="130" rx="16" fill="#121316" stroke="#232427" stroke-width="1.5" />
      <circle cx="-360" cy="65" r="30" fill="#17181b" stroke="#c9a24b" stroke-width="1.5" />
      <text x="-360" y="73" text-anchor="middle" fill="#c9a24b" class="display" font-size="20">04</text>
      <text x="-300" y="50" fill="#edebe6" class="display" font-size="22">Vídeos &amp; Peças Visuais</text>
      <text x="-300" y="85" fill="#9a958a" class="body" font-size="16">Briefings completos de imagens, roteiros e adaptações para tráfego.</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(540, 1220)">
    <line x1="-400" y1="0" x2="400" y2="0" stroke="#232427" stroke-width="1" />
    <text x="0" y="45" text-anchor="middle" fill="#9a958a" class="mono" font-size="14" letter-spacing="2">PRÓXIMO: GERÊNCIA COMERCIAL ▸</text>
  </g>
</svg>
