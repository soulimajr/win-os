<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0c0e" />
      <stop offset="50%" stop-color="#121316" />
      <stop offset="100%" stop-color="#070809" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8d596" />
      <stop offset="35%" stop-color="#c9a24b" />
      <stop offset="70%" stop-color="#f3e5ab" />
      <stop offset="100%" stop-color="#8a6e33" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', Consolas, 'Roboto Mono', monospace; }
    .display { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; }
  </style>

  <rect width="1080" height="1350" fill="url(#bgGrad)" />
  <rect x="40" y="40" width="1000" height="1270" rx="24" fill="none" stroke="#232427" stroke-width="1.5" />
  <rect x="52" y="52" width="976" height="1246" rx="20" fill="none" stroke="#c9a24b" stroke-width="1" opacity="0.25" />

  <!-- Header Pill -->
  <g transform="translate(540, 110)">
    <rect x="-130" y="-20" width="260" height="40" rx="20" fill="#17181b" stroke="#232427" stroke-width="1.5" />
    <text x="0" y="6" text-anchor="middle" fill="#c9a24b" class="mono" font-size="14" letter-spacing="3">/ 05. ATIVACAO.SYS</text>
  </g>

  <!-- Title -->
  <g transform="translate(540, 220)">
    <text x="0" y="0" text-anchor="middle" fill="#edebe6" class="display" font-size="44" letter-spacing="-0.5">TENHA ESSA DIRETORIA</text>
    <text x="0" y="55" text-anchor="middle" fill="url(#goldGrad)" class="display" font-size="44" letter-spacing="-0.5">RODANDO HOJE NA SUA EMPRESA</text>
  </g>

  <!-- Shield in Gold -->
  <g transform="translate(540, 420)">
    <path d="M0 -90 L75 -45 L75 30 C75 85 0 125 0 125 C0 125 -75 85 -75 30 L-75 -45 Z" fill="#17181b" stroke="url(#goldGrad)" stroke-width="3" filter="url(#glow)" />
    <!-- W in Gold -->
    <path d="M-36 -20 L-20 35 L0 0 L20 35 L36 -20 L20 -20 L10 15 L0 -10 L-10 15 L-20 -20 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Main Pricing Card -->
  <g transform="translate(540, 690)">
    <rect x="-380" y="-100" width="760" height="200" rx="20" fill="#121316" stroke="url(#goldGrad)" stroke-width="2" />
    <text x="0" y="-55" text-anchor="middle" fill="#c9a24b" class="mono" font-size="14" letter-spacing="2">ACESSO VITALÍCIO COMPLETO</text>
    <text x="0" y="20" text-anchor="middle" fill="#edebe6" class="display" font-size="68" letter-spacing="-1">R$ 47</text>
    <text x="0" y="65" text-anchor="middle" fill="#9a958a" class="body" font-size="18">Pagamento único · Sem mensalidades · 43 Skills inclusas</text>
  </g>

  <!-- Guarantee Badge -->
  <g transform="translate(540, 880)">
    <rect x="-300" y="-30" width="600" height="60" rx="30" fill="#17181b" stroke="#232427" stroke-width="1.5" />
    <text x="0" y="7" text-anchor="middle" fill="#edebe6" class="body" font-size="17">🛡️ Garantia incondicional de 7 dias ou seu dinheiro de volta</text>
  </g>

  <!-- CTA Button -->
  <g transform="translate(540, 1020)">
    <rect x="-350" y="-40" width="700" height="80" rx="40" fill="url(#goldGrad)" filter="url(#glow)" />
    <text x="0" y="10" text-anchor="middle" fill="#0b0c0e" class="display" font-size="22" letter-spacing="1">CLIQUE NO LINK DA BIO (@winos.ia)</text>
  </g>

  <g transform="translate(540, 1110)">
    <text x="0" y="0" text-anchor="middle" fill="#c9a24b" class="display" font-size="18">ou comente "EQUIPE" neste post</text>
  </g>

  <!-- Footer -->
  <g transform="translate(540, 1220)">
    <line x1="-400" y1="0" x2="400" y2="0" stroke="#232427" stroke-width="1" />
    <text x="0" y="45" text-anchor="middle" fill="#9a958a" class="mono" font-size="14" letter-spacing="2">WINOS.CREATIVEAGENCIAMKT.COM.BR</text>
  </g>
</svg>
