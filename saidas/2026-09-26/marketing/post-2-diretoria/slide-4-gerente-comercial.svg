<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0c0e" />
      <stop offset="50%" stop-color="#121316" />
      <stop offset="100%" stop-color="#070809" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8d596" />
      <stop offset="35%" stop-color="#c9a24b" />
      <stop offset="70%" stop-color="#f3e5ab" />
      <stop offset="100%" stop-color="#8a6e33" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', Consolas, 'Roboto Mono', monospace; }
    .display { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; }
  </style>

  <rect width="1080" height="1350" fill="url(#bgGrad)" />
  <rect x="40" y="40" width="1000" height="1270" rx="24" fill="none" stroke="#232427" stroke-width="1.5" />
  <rect x="52" y="52" width="976" height="1246" rx="20" fill="none" stroke="#c9a24b" stroke-width="1" opacity="0.25" />

  <!-- Header Pill -->
  <g transform="translate(540, 110)">
    <rect x="-140" y="-20" width="280" height="40" rx="20" fill="#17181b" stroke="#232427" stroke-width="1.5" />
    <text x="0" y="6" text-anchor="middle" fill="#c9a24b" class="mono" font-size="14" letter-spacing="3">/ 03. COMERCIAL.SYS</text>
  </g>

  <!-- Title -->
  <g transform="translate(540, 220)">
    <text x="0" y="0" text-anchor="middle" fill="#edebe6" class="display" font-size="44" letter-spacing="-0.5">GERENTE COMERCIAL</text>
    <text x="0" y="55" text-anchor="middle" fill="url(#goldGrad)" class="display" font-size="44" letter-spacing="-0.5">&amp; JORNADA DE VENDAS</text>
    <text x="0" y="105" text-anchor="middle" fill="#9a958a" class="mono" font-size="16" letter-spacing="2">7 SKILLS DO PRIMEIRO CONTATO AO CONTRATO</text>
  </g>

  <!-- Customer Journey Steps -->
  <g transform="translate(540, 420)">
    <!-- Etapa 1: Prospecção -->
    <g transform="translate(0, 0)">
      <rect x="-420" y="0" width="840" height="110" rx="16" fill="#121316" stroke="#232427" stroke-width="1.5" />
      <text x="-380" y="62" fill="#c9a24b" class="mono" font-size="18">01 ▸</text>
      <text x="-320" y="48" fill="#edebe6" class="display" font-size="20">Prospecção Ativa &amp; Identificação</text>
      <text x="-320" y="78" fill="#9a958a" class="body" font-size="15">Mapeamento de empresas ideais e abordagens frias personalizadas.</text>
    </g>

    <!-- Etapa 2: Qualificação -->
    <g transform="translate(0, 135)">
      <rect x="-420" y="0" width="840" height="110" rx="16" fill="#121316" stroke="#232427" stroke-width="1.5" />
      <text x="-380" y="62" fill="#c9a24b" class="mono" font-size="18">02 ▸</text>
      <text x="-320" y="48" fill="#edebe6" class="display" font-size="20">Qualificação Técnica de Leads</text>
      <text x="-320" y="78" fill="#9a958a" class="body" font-size="15">Filtro de orçamento, maturidade e urgência para não perder tempo com curiosos.</text>
    </g>

    <!-- Etapa 3: Proposta -->
    <g transform="translate(0, 270)">
      <rect x="-420" y="0" width="840" height="110" rx="16" fill="#17181b" stroke="#c9a24b" stroke-width="1.5" />
      <text x="-380" y="62" fill="#c9a24b" class="mono" font-size="18">03 ★</text>
      <text x="-320" y="48" fill="#c9a24b" class="display" font-size="20">Propostas Comerciais Personalizadas</text>
      <text x="-320" y="78" fill="#edebe6" class="body" font-size="15">Cruza o histórico do cliente e gera o escopo pronto em minutos.</text>
    </g>

    <!-- Etapa 4: Onboarding -->
    <g transform="translate(0, 405)">
      <rect x="-420" y="0" width="840" height="110" rx="16" fill="#121316" stroke="#232427" stroke-width="1.5" />
      <text x="-380" y="62" fill="#c9a24b" class="mono" font-size="18">04 ▸</text>
      <text x="-320" y="48" fill="#edebe6" class="display" font-size="20">Onboarding de Novos Clientes</text>
      <text x="-320" y="78" fill="#9a958a" class="body" font-size="15">Boas-vindas estruturadas, coleta de acessos e alinhamento de expectativas.</text>
    </g>

    <!-- Etapa 5: Retenção -->
    <g transform="translate(0, 540)">
      <rect x="-420" y="0" width="840" height="110" rx="16" fill="#121316" stroke="#232427" stroke-width="1.5" />
      <text x="-380" y="62" fill="#c9a24b" class="mono" font-size="18">05 ▸</text>
      <text x="-320" y="48" fill="#edebe6" class="display" font-size="20">Retenção &amp; Prevenção de Churn</text>
      <text x="-320" y="78" fill="#9a958a" class="body" font-size="15">Pesquisas de satisfação e rotinas de acompanhamento para contratos longos.</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(540, 1220)">
    <line x1="-400" y1="0" x2="400" y2="0" stroke="#232427" stroke-width="1" />
    <text x="0" y="45" text-anchor="middle" fill="#9a958a" class="mono" font-size="14" letter-spacing="2">PRÓXIMO: FINANCEIRO &amp; ADMINISTRAÇÃO ▸</text>
  </g>
</svg>
