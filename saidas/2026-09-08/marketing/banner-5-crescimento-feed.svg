      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="50%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#B22222"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="#000000"/>

  <text x="540" y="420" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF">
