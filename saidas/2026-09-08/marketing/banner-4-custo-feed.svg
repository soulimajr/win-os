<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="50%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#B22222"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="#000000"/>

  <text x="540" y="430" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="54" fill="#FFFFFF">
    <tspan x="540" dy="0">CADA DIA SEM TRÁFEGO</tspan>
    <tspan x="540" dy="70">PAGO É UM CLIENTE QUE</tspan>
    <tspan x="540" dy="70">FECHOU COM OUTRO.</tspan>
  </text>

  <rect x="390" y="670" width="300" height="6" rx="3" fill="url(#g1)"/>

  <text x="540" y="740" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="30" fill="#CCCCCC">
    <tspan x="540" dy="0">Invisibilidade tem custo — só</tspan>
    <tspan x="540" dy="42">que ele não aparece na sua</tspan>
    <tspan x="540" dy="42">planilha.</tspan>
  </text>

  <text x="540" y="1120" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="38" fill="url(#g1)">
    <tspan x="540" dy="0">NÃO DEIXA O CLIENTE</tspan>
    <tspan x="540" dy="48">IR EMBORA</tspan>
  </text>

  <path d="M 570 1250 A 34 34 0 1 0 570 1300" fill="none" stroke="url(#g1)" stroke-width="12" stroke-linecap="round"/>
</svg>
