<svg viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="50%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#B22222"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7A00" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#B22222" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1920" fill="#000000"/>

  <!-- burst glow -->
  <circle cx="540" cy="520" r="480" fill="url(#glow)"/>
  <g stroke="#FFB347" stroke-width="10" opacity="0.55" stroke-linecap="round">
    <line x1="540" y1="520" x2="540" y2="60" transform="rotate(0 540 520)"/>
    <line x1="540" y1="520" x2="540" y2="60" transform="rotate(30 540 520)"/>
    <line x1="540" y1="520" x2="540" y2="60" transform="rotate(60 540 520)"/>
    <line x1="540" y1="520" x2="540" y2="60" transform="rotate(90 540 520)"/>
    <line x1="540" y1="520" x2="540" y2="60" transform="rotate(120 540 520)"/>
    <line x1="540" y1="520" x2="540" y2="60" transform="rotate(150 540 520)"/>
    <line x1="540" y1="520" x2="540" y2="60" transform="rotate(180 540 520)"/>
    <line x1="540" y1="520" x2="540" y2="60" transform="rotate(210 540 520)"/>
    <line x1="540" y1="520" x2="540" y2="60" transform="rotate(240 540 520)"/>
    <line x1="540" y1="520" x2="540" y2="60" transform="rotate(270 540 520)"/>
    <line x1="540" y1="520" x2="540" y2="60" transform="rotate(300 540 520)"/>
    <line x1="540" y1="520" x2="540" y2="60" transform="rotate(330 540 520)"/>
  </g>

  <!-- headline with outline effect -->
  <text x="540" y="460" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="82" fill="#FFFFFF" stroke="#8B0000" stroke-width="6" paint-order="stroke" style="letter-spacing:1px">
    <tspan x="540" dy="0">SEU CONCORRENTE</tspan>
  </text>
  <text x="540" y="560" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="82" fill="url(#g1)" stroke="#8B0000" stroke-width="6" paint-order="stroke">
    <tspan x="540" dy="0">JÁ APARECE</tspan>
  </text>
  <text x="540" y="650" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="60" fill="#FFFFFF">
    <tspan x="540" dy="0">PRO CLIENTE QUE VOCÊ QUER</tspan>
  </text>

  <!-- bullets -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="36" fill="#FFFFFF">
    <circle cx="150" cy="900" r="30" fill="url(#g1)"/>
    <text x="150" y="912" text-anchor="middle" font-size="34" fill="#000">✓</text>
    <text x="210" y="912">ELE JÁ ESTÁ SENDO VISTO</text>

    <circle cx="150" cy="990" r="30" fill="url(#g1)"/>
    <text x="150" y="1002" text-anchor="middle" font-size="34" fill="#000">⏱</text>
    <text x="210" y="1002">ENQUANTO VOCÊ ESPERA SER ACHADO</text>

    <circle cx="150" cy="1080" r="30" fill="url(#g1)"/>
    <text x="150" y="1092" text-anchor="middle" font-size="34" fill="#000">📉</text>
    <text x="210" y="1092">ISSO CUSTA CLIENTE TODO DIA</text>
  </g>

  <!-- CTA ribbon -->
  <polygon points="60,1720 1020,1720 1080,1800 1020,1880 60,1880 0,1800" fill="url(#g1)"/>
  <text x="540" y="1780" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="46" fill="#000000">
    <tspan x="540" dy="0">FALA COM A GENTE</tspan>
    <tspan x="540" dy="52">E SAI NA FRENTE »»</tspan>
  </text>
</svg>
